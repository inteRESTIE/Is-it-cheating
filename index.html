<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is It Cheating?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0d0b;
    --surface: #181713;
    --surface2: #201e19;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0ece3;
    --muted: #7a756a;
    --accent: #c9a96e;
    --accent2: #e8c88a;
    --red: #d95f3f;
    --red-bg: rgba(217,95,63,0.12);
    --green: #4caf84;
    --green-bg: rgba(76,175,132,0.12);
    --radius: 14px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 400; line-height: 1.6; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E"); opacity: 0.025; pointer-events: none; z-index: 9999; }
  .bg-glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%); top: -200px; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 0; }
  .wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3rem 1.5rem 5rem; }
  header { text-align: center; margin-bottom: 3rem; animation: fadeUp 0.6s ease both; }
  .eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem; font-weight: 500; }
  h1 { font-family: var(--font-display); font-size: clamp(2.4rem, 6vw, 3.5rem); font-weight: 700; color: var(--text); line-height: 1.1; margin-bottom: 0.5rem; }
  h1 em { font-style: italic; color: var(--accent2); }
  .subtitle { font-size: 15px; color: var(--muted); max-width: 340px; margin: 0 auto; }
  .stats { display: flex; gap: 2rem; margin-bottom: 2.5rem; animation: fadeUp 0.6s 0.1s ease both; }
  .stat { text-align: center; }
  .stat-val { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--accent2); line-height: 1; }
  .stat-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .stat-divider { width: 1px; background: var(--border2); align-self: stretch; }
  .progress-wrap { width: 100%; max-width: 560px; margin-bottom: 2rem; animation: fadeUp 0.6s 0.15s ease both; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-track { height: 2px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .card { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; animation: fadeUp 0.5s 0.2s ease both; }
  .card-inner { padding: 2.5rem; }
  .category-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.2); border-radius: 99px; padding: 4px 12px; margin-bottom: 1.5rem; }
  .scenario-text { font-family: var(--font-display); font-size: clamp(1.05rem, 2.3vw, 1.25rem); line-height: 1.65; color: var(--text); font-weight: 700; margin-bottom: 0.5rem; }
  .scenario-hint { font-size: 13px; color: var(--muted); margin-bottom: 2rem; font-style: italic; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice-btn { padding: 1.1rem 1rem; border-radius: 10px; border: 1px solid var(--border2); font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.18s ease; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--surface2); color: var(--text); position: relative; overflow: hidden; }
  .choice-btn::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.18s; }
  .choice-btn:hover { transform: translateY(-2px); }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn.yes { border-color: rgba(217,95,63,0.3); }
  .choice-btn.yes::before { background: var(--red-bg); }
  .choice-btn.yes:hover::before { opacity: 1; }
  .choice-btn.yes:hover { border-color: var(--red); color: var(--red); }
  .choice-btn.no { border-color: rgba(76,175,132,0.3); }
  .choice-btn.no::before { background: var(--green-bg); }
  .choice-btn.no:hover::before { opacity: 1; }
  .choice-btn.no:hover { border-color: var(--green); color: var(--green); }
  .choice-btn span.icon { font-size: 24px; line-height: 1; }
  .choice-btn span.label { position: relative; }
  .choice-btn:disabled { cursor: default; transform: none; pointer-events: none; }
  .verdict { border-top: 1px solid var(--border); padding: 1.5rem 2.5rem; display: none; animation: fadeUp 0.4s ease both; }
  .verdict.show { display: block; }
  .verdict-header { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
  .verdict-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .verdict-dot.cheating { background: var(--red); }
  .verdict-dot.not { background: var(--green); }
  .verdict-result { font-size: 13px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
  .verdict-result.cheating { color: var(--red); }
  .verdict-result.not { color: var(--green); }
  .verdict-badge { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 500; }
  .verdict-badge.agree { background: rgba(76,175,132,0.15); color: var(--green); }
  .verdict-badge.disagree { background: rgba(217,95,63,0.15); color: var(--red); }
  .verdict-explanation { font-size: 14px; line-height: 1.7; color: var(--muted); margin-bottom: 0.75rem; }
  .verdict-majority { font-size: 12px; color: var(--muted); font-style: italic; opacity: 0.7; }
  .next-wrap { padding: 1rem 2.5rem 1.5rem; display: none; }
  .next-wrap.show { display: block; }
  .next-btn { width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--border2); border-radius: 10px; color: var(--accent2); font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.18s ease; letter-spacing: 0.04em; }
  .next-btn:hover { background: rgba(201,169,110,0.07); border-color: var(--accent); }
  .next-btn:active { transform: scale(0.98); }
  .results { width: 100%; max-width: 560px; text-align: center; display: none; animation: fadeUp 0.5s ease both; }
  .results.show { display: block; }
  .results-orb { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(232,200,138,0.25), rgba(201,169,110,0.05)); border: 1px solid rgba(201,169,110,0.25); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .results-score { font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--accent2); }
  .results-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
  .results-sub { font-size: 14px; color: var(--muted); margin-bottom: 2rem; }
  .personality-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; text-align: left; }
  .personality-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
  .personality-text { font-size: 15px; line-height: 1.7; color: var(--text); }
  .breakdown { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.5rem; text-align: left; max-height: 320px; overflow-y: auto; }
  .breakdown-row { display: flex; align-items: center; padding: 0.75rem 1.25rem; font-size: 13px; gap: 12px; border-bottom: 1px solid var(--border); }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-q { flex: 1; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .breakdown-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .breakdown-dot.agreed { background: var(--green); }
  .breakdown-dot.disagreed { background: var(--red); }
  .play-again { width: 100%; max-width: 560px; padding: 1rem; background: rgba(201,169,110,0.08); border: 1px solid rgba(201,169,110,0.25); border-radius: 10px; color: var(--accent2); font-family: var(--font-body); font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.18s ease; letter-spacing: 0.04em; }
  .play-again:hover { background: rgba(201,169,110,0.14); border-color: var(--accent2); }
  .play-again:active { transform: scale(0.98); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .card-swap { animation: fadeUp 0.38s ease both; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .wrapper { padding: 2rem 1rem 6rem; }
    header { margin-bottom: 2rem; }
    h1 { font-size: 2.2rem; }
    .subtitle { font-size: 14px; }
    .stats { gap: 1.25rem; margin-bottom: 1.75rem; }
    .stat-val { font-size: 22px; }
    .stat-label { font-size: 10px; }
    .progress-wrap { margin-bottom: 1.25rem; }
    .card-inner { padding: 1.25rem 1.25rem 1rem; }
    .category-tag { font-size: 10px; padding: 3px 10px; margin-bottom: 1rem; }
    .scenario-text { font-size: 1.05rem; line-height: 1.6; margin-bottom: 0.4rem; }
    .scenario-hint { font-size: 12px; margin-bottom: 1.25rem; }
    .btn-row { gap: 8px; }
    .choice-btn { padding: 1rem 0.75rem; font-size: 13px; gap: 5px; border-radius: 10px; }
    .choice-btn span.icon { font-size: 20px; }
    /* Make buttons easier to tap — min 52px tall */
    .choice-btn { min-height: 52px; }
    .verdict { padding: 1rem 1.25rem; }
    .verdict-result { font-size: 11px; }
    .verdict-badge { font-size: 10px; padding: 2px 8px; }
    .verdict-explanation { font-size: 13px; }
    .verdict-majority { font-size: 11px; }
    .next-wrap { padding: 0.75rem 1.25rem 1.25rem; }
    .next-btn { padding: 0.9rem; font-size: 14px; min-height: 52px; }
    .results-orb { width: 100px; height: 100px; }
    .results-score { font-size: 2.4rem; }
    .results-title { font-size: 1.5rem; }
    .results-sub { font-size: 13px; margin-bottom: 1.5rem; }
    .personality-card { padding: 1.1rem; }
    .personality-text { font-size: 14px; }
    .breakdown { max-height: 260px; }
    .breakdown-row { padding: 0.65rem 1rem; gap: 10px; }
    .breakdown-q { font-size: 11px; }
    .play-again { font-size: 14px; padding: 0.9rem; min-height: 52px; }
  }

  /* ── Tiny phones (≤ 380px) ── */
  @media (max-width: 380px) {
    .wrapper { padding: 1.5rem 0.75rem 5rem; }
    h1 { font-size: 1.9rem; }
    .stats { gap: 0.9rem; }
    .stat-val { font-size: 20px; }
    .card-inner { padding: 1rem; }
    .scenario-text { font-size: 1rem; }
  }

  /* Touch: remove hover transform on touch devices */
  @media (hover: none) {
    .choice-btn:hover { transform: none; }
    .choice-btn:active { transform: scale(0.96); }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrapper">
  <header>
    <div class="eyebrow">A relationship morality game</div>
    <h1>Is it <em>cheating?</em></h1>
    <p class="subtitle">200 scenarios. Realistic, absurd, hypothetical. You decide.</p>
    <p style="font-size:12px;color:var(--muted);margin-top:0.5rem;letter-spacing:0.05em;">created by <span style="color:var(--accent);">Restie</span></p>
  </header>
  <div class="stats" id="stats">
    <div class="stat">
      <div class="stat-val" id="agree-val">0</div>
      <div class="stat-label">With majority</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-val" id="q-val">1 / 100</div>
      <div class="stat-label">Scenarios</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-val" id="streak-val">—</div>
      <div class="stat-label">Streak</div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="progress-label">Question 1 of 100</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="card" id="main-card">
    <div class="card-inner" id="card-inner">
      <div class="category-tag" id="cat-tag">Realistic</div>
      <p class="scenario-text" id="scenario-text">Loading...</p>
      <p class="scenario-hint" id="scenario-hint"></p>
      <div class="btn-row">
        <button class="choice-btn yes" id="btn-yes" onclick="answer(true)">
          <span class="icon">💔</span>
          <span class="label">Yes, cheating</span>
        </button>
        <button class="choice-btn no" id="btn-no" onclick="answer(false)">
          <span class="icon">✓</span>
          <span class="label">Not cheating</span>
        </button>
      </div>
    </div>
    <div class="verdict" id="verdict">
      <div class="verdict-header">
        <div class="verdict-dot" id="verdict-dot"></div>
        <div class="verdict-result" id="verdict-result"></div>
        <div class="verdict-badge" id="verdict-badge"></div>
      </div>
      <p class="verdict-explanation" id="verdict-explanation"></p>
      <p class="verdict-majority" id="verdict-majority"></p>
    </div>
    <div class="next-wrap" id="next-wrap">
      <button class="next-btn" id="next-btn" onclick="next()">Continue →</button>
    </div>
  </div>
  <div class="results" id="results-screen">
    <div class="results-orb">
      <span class="results-score" id="final-pct">—</span>
    </div>
    <h2 class="results-title" id="results-title">Your verdict</h2>
    <p class="results-sub" id="results-sub"></p>
    <div class="personality-card">
      <div class="personality-label">Your relationship moral profile</div>
      <p class="personality-text" id="personality-text"></p>
    </div>
    <div class="breakdown" id="breakdown"></div>
    <button class="play-again" onclick="restart()">↺ &nbsp; Play again — new random order</button>
  </div>
</div>

<script>
const ALL_SCENARIOS = [
  // --- REALISTIC ---
  { category: "Realistic", text: "You kiss someone at a party while drunk. You feel sick about it immediately. You never tell your partner.", hint: "A moment of weakness — or more?", verdict: true, explanation: "The kiss is cheating. The cover-up extends it. Most people say the truth is owed, even when it's painful.", majorityLabel: "Most say: yes — and silence makes it worse" },
  { category: "Realistic", text: "You're texting someone you used to date every day. Your partner doesn't know they exist.", hint: "Nothing physical has happened.", verdict: true, explanation: "A secret daily connection with an ex is considered an emotional affair by most people, regardless of content.", majorityLabel: "Most say: yes — the secrecy is the red flag" },
  { category: "Realistic", text: "You and your partner are on a break. You hook up with someone. You get back together a week later and don't mention it.", hint: "You both agreed to the break. Its terms were never defined.", verdict: false, explanation: "A genuine break generally means the relationship is paused. Most people say what happens during a break doesn't count — though it depends on what 'break' meant to both of you.", majorityLabel: "Divided — 'it depends on the break rules'" },
  { category: "Realistic", text: "You have coffee with your ex every few months to catch up. Your partner knows, and is fine with it.", hint: "It's all transparent.", verdict: false, explanation: "Transparency is the key ingredient. If your partner knows and consents, most people say there's no betrayal.", majorityLabel: "Most say: no — openness makes it fine" },
  { category: "Realistic", text: "You lie to your partner about who you're going to lunch with — it's a coworker you find attractive. Nothing happens at lunch.", hint: "You lied about the 'who,' not the 'what.'", verdict: true, explanation: "The lie reveals that you knew it would bother your partner. Most people say deliberately hiding who you're seeing is a form of betrayal, even without physical contact.", majorityLabel: "Most say: yes — the lie is the problem" },
  { category: "Realistic", text: "You tell your therapist things about your relationship that you've never told your partner — including that you're attracted to someone else.", hint: "Therapy is confidential by design.", verdict: false, explanation: "Therapy is a protected space for honesty. Most people don't consider sharing private feelings with a therapist to be cheating — it's the point of the exercise.", majorityLabel: "Most say: no — that's what therapy is for" },
  { category: "Realistic", text: "You follow your ex on every social media platform. You watch every story. You never interact.", hint: "You just… watch.", verdict: false, explanation: "Passive social media consumption, even of an ex, isn't considered cheating by most people — though it can signal unresolved feelings worth examining.", majorityLabel: "Most say: no — lurking isn't betrayal" },
  { category: "Realistic", text: "You and your partner have been arguing for weeks. You vent to a close friend of the opposite sex about how unhappy you are, including sharing intimate details of your relationship.", hint: "You're not attracted to this friend. You're just talking.", verdict: false, explanation: "Venting to a trusted friend isn't cheating. What matters is whether those conversations lead somewhere else — and here, they don't.", majorityLabel: "Most say: no — everyone needs to vent" },
  { category: "Realistic", text: "You match with your ex on a dating app while you're in a relationship. You don't message them, but you don't unmatch either.", hint: "Why are you on a dating app at all?", verdict: true, explanation: "Being on a dating app while in a relationship is itself a problem most partners would consider a breach. Leaving the match open suggests you're keeping a door ajar.", majorityLabel: "Most say: yes — the app itself is the issue" },
  { category: "Realistic", text: "You fantasize about a celebrity constantly. You've built an elaborate imaginary relationship with them in your head.", hint: "They don't know you exist.", verdict: false, explanation: "Fantasy is internal. Celebrities, fictional characters, and the completely inaccessible don't count as cheating in most people's books.", majorityLabel: "Most say: no — we can't police imagination" },
  { category: "Realistic", text: "You sext someone you met online. You've never met in person and never planned to. It happened once.", hint: "You deleted the messages.", verdict: true, explanation: "Sexting is widely considered cheating — the physical distance doesn't remove the sexual intimacy or the deception.", majorityLabel: "Most say: yes — digital intimacy still counts" },
  { category: "Realistic", text: "Your partner is in a coma. You haven't left their side for months. You begin developing feelings for one of the nurses. You don't act on them.", hint: "You're exhausted, heartbroken, and human.", verdict: false, explanation: "Feelings that arise from extreme grief and stress aren't a choice. Most people say having feelings, without acting on them, is not cheating — especially in this context.", majorityLabel: "Most say: no — feelings alone aren't betrayal" },
  { category: "Realistic", text: "You tell your partner you're working late. You're actually at a bar with friends. No romantic involvement at all — you just didn't want a fight about going out.", hint: "You lied to avoid conflict, not to hide romance.", verdict: false, explanation: "Lying about whereabouts to avoid conflict is dishonest but not cheating in the romantic sense. Most people separate these — though they'd still say the lie is a problem.", majorityLabel: "Most say: not cheating, but still a problem" },
  { category: "Realistic", text: "You sleep with someone else. You feel terrible. You break up with your partner before telling them — technically, so you're already single when you confess.", hint: "You engineered the timeline carefully.", verdict: true, explanation: "Engineering a breakup to retroactively make your infidelity 'okay' is almost universally seen as dishonest and cowardly. You cheated; then you managed the narrative.", majorityLabel: "Most say: yes — the sequencing was manipulation" },
  { category: "Realistic", text: "Your long-distance partner asks where you are every hour. Out of frustration, you stop answering for a few hours. You were at home alone.", hint: "You weren't doing anything. You were just done responding.", verdict: false, explanation: "Refusing to be constantly monitored is not cheating. Most people would call this a reasonable assertion of privacy, even if the communication should be addressed.", majorityLabel: "Most say: no — you don't owe hourly check-ins" },

  // --- EMOTIONAL / GRAY AREA ---
  { category: "Emotional", text: "You've been having long, late-night phone calls with a friend for months — talking about life, dreams, and loneliness. You've started to look forward to them more than any conversation with your partner.", hint: "You haven't admitted this to yourself yet.", verdict: true, explanation: "Emotional intimacy that exceeds what you share with your partner, especially in secret, is what most people call an emotional affair.", majorityLabel: "Most say: yes — this is an emotional affair" },
  { category: "Emotional", text: "You write love letters to someone you have feelings for but never send them. They sit in a folder on your computer.", hint: "They'll never see them.", verdict: false, explanation: "Unexpressed feelings kept private aren't betrayal. Most people see unsent letters as a form of private emotional processing, not infidelity.", majorityLabel: "Most say: no — unsent isn't unfaithful" },
  { category: "Emotional", text: "You tell someone you barely know 'I love you' while extremely drunk. You don't even remember their name.", hint: "You genuinely have no recollection.", verdict: false, explanation: "A meaningless, unconscious utterance with no context or connection is not cheating in most people's eyes. It's embarrassing — but not betrayal.", majorityLabel: "Most say: no — that's just drunk nonsense" },
  { category: "Emotional", text: "You realize you're in love with your best friend. You don't tell anyone — not your friend, not your partner. You quietly begin distancing yourself from both.", hint: "You're trying to do the right thing, painfully.", verdict: false, explanation: "Having feelings for someone isn't cheating. Trying to manage those feelings responsibly — even clumsily — is not the same as acting on them.", majorityLabel: "Most say: no — feelings without action aren't betrayal" },
  { category: "Emotional", text: "You and a coworker have an intensely flirtatious dynamic at the office. You've never discussed it. No texts, no plans, nothing outside work. But you both know.", hint: "It's all subtext, all the time.", verdict: true, explanation: "Sustained mutual flirtation — even unspoken — that you hide from your partner is considered a form of emotional infidelity by most people.", majorityLabel: "Most say: yes — mutual charged energy still counts" },
  { category: "Emotional", text: "You tell your partner you've never been in love before meeting them. That's not true — you were deeply in love with someone ten years ago.", hint: "You wanted to give them something special. You lied.", verdict: false, explanation: "Omitting or romanticizing past relationships isn't romantic cheating — it's insecurity. Most people wouldn't call this infidelity, though it is dishonest.", majorityLabel: "Most say: no — this is a white lie, not cheating" },
  { category: "Emotional", text: "You're genuinely happier talking to your online friend than to your partner. You've never met this person. You think about them every day.", hint: "You've started to wonder 'what if.'", verdict: true, explanation: "An emotional priority shift toward someone else — especially when it comes with secrecy and fantasy — is the beginning of an emotional affair in most people's view.", majorityLabel: "Most say: yes — the shift in emotional priority matters" },

  // --- DIGITAL / MODERN ---
  { category: "Digital", text: "You have a secret Instagram account that only your ex follows. You post thirst traps on it.", hint: "Your partner doesn't know the account exists.", verdict: true, explanation: "A secret account designed to attract attention from an ex, hidden from your partner, is a form of emotional and digital infidelity by most people's standards.", majorityLabel: "Most say: yes — secret accounts are a red flag" },
  { category: "Digital", text: "You play an online role-playing game where your character is in a romantic relationship with another player's character. It's all fictional lore.", hint: "You and this player have never spoken outside the game.", verdict: false, explanation: "In-game fictional romance is widely considered part of gameplay, not real-world infidelity — unless it bleeds outside the game.", majorityLabel: "Most say: no — in-game fiction isn't real betrayal" },
  { category: "Digital", text: "You pay for a parasocial streamer's subscription and send her super chats calling her 'my queen.' Your partner doesn't know how much money or attention you're giving her.", hint: "It's transactional… mostly.", verdict: false, explanation: "Most people consider fan spending on streamers to be a hobby, not infidelity — though hiding significant spending from a partner is a financial honesty issue worth discussing.", majorityLabel: "Most say: no — but the hiding is still a problem" },
  { category: "Digital", text: "You have an AI companion app — you talk to it every day, share your feelings, and consider it a form of emotional support. You haven't told your partner it exists.", hint: "You know it's not real. But it feels real.", verdict: false, explanation: "Most people don't consider AI companions infidelity — they're not sentient and can't reciprocate. But hiding it from your partner suggests you know it touches something worth examining.", majorityLabel: "Most say: no — but talk to your actual partner" },
  { category: "Digital", text: "You screenshot private photos your partner sent you and keep them in a hidden folder after you break up.", hint: "Technically it happened after the relationship ended.", verdict: true, explanation: "Retaining intimate images without consent after a relationship ends is a privacy violation and in many places illegal. Most people consider this a deep betrayal of trust.", majorityLabel: "Most say: yes — this is a serious violation" },
  { category: "Digital", text: "You have a deep, years-long pen pal relationship with someone you met online. You've shared things with them you've never shared with your partner. Your partner doesn't know.", hint: "No romantic or sexual content. Just honesty.", verdict: true, explanation: "Sustained secret intimacy with someone outside the relationship — even if not romantic in content — is considered a form of emotional infidelity by most.", majorityLabel: "Most say: yes — the secrecy and depth make it an affair" },
  { category: "Digital", text: "You use a face-swap app to put your partner's face on adult content. You never share it with anyone.", hint: "You created it; no one else saw it.", verdict: true, explanation: "Creating non-consensual intimate imagery of your partner, even privately, is a violation of their consent and trust. Most people would consider this a serious betrayal.", majorityLabel: "Most say: yes — consent makes all the difference" },
  { category: "Digital", text: "You read your partner's diary that they left on the kitchen table, open to a page. You only read one page before stopping.", hint: "It was open. You stopped yourself.", verdict: false, explanation: "Accidentally encountering open content and stopping yourself is different from actively seeking private information. Most people give a pass here — barely.", majorityLabel: "Divided — stopping matters, but so does intent" },

  // --- ABSURD ---
  { category: "Absurd", text: "You are temporarily cloned by scientists. Your clone sleeps with someone else while you are sedated. Neither clone nor original consented to this scenario.", hint: "This is fully out of your control.", verdict: false, explanation: "If you had no knowledge, no body present, and no agency in the act, most people say there's no betrayal of intent — just a very bad scientist.", majorityLabel: "Most say: no — science did this, not you" },
  { category: "Absurd", text: "A wizard casts a spell that gives you the exact memories and feelings of a person who cheated on their partner. You live through the entire affair in your mind. None of it actually happened.", hint: "You felt it all. You did none of it.", verdict: false, explanation: "Involuntarily experiencing someone else's memories — however vivid — doesn't constitute action. Most people say you're a victim of a wizard, not an unfaithful partner.", majorityLabel: "Most say: no — memories aren't actions" },
  { category: "Absurd", text: "You travel back in time and sleep with your partner before you ever met them — technically before the relationship existed.", hint: "From their perspective in that timeline, you were a stranger.", verdict: false, explanation: "Most people agree that the relationship didn't exist at the time of the encounter. Paradoxically, chronology matters. This is the universe's problem, not yours.", majorityLabel: "Most say: no — the relationship didn't exist yet" },
  { category: "Absurd", text: "Your partner wakes up one day with complete amnesia. They don't know you. Over the next three months of their recovery, you fall in love with who they've become. You sleep with them.", hint: "It's still your partner's body. But who are they now?", verdict: false, explanation: "This is an ethical puzzle with no clean answer. Most people lean toward 'no' since the relationship technically continues with the same person — but it's genuinely contested.", majorityLabel: "Genuinely divided — philosophy breaks down here" },
  { category: "Absurd", text: "You have a recurring dream, three nights a week, in which you and your neighbor are in a passionate affair. You wake up feeling guilty every time.", hint: "You've never looked at your neighbor sideways in real life.", verdict: false, explanation: "Dreams are involuntary and unconscious. Most people agree you can't be held responsible for what your sleeping brain invents.", majorityLabel: "Most say: no — you can't control your dreams" },
  { category: "Absurd", text: "An evil twin you didn't know existed shows up and seduces your partner, pretending to be you. Your partner doesn't know the difference.", hint: "Classic evil twin scenario. Very real problem.", verdict: false, explanation: "If the other party was deceived into thinking they were with you, there was no breach of loyalty — from either of you. The evil twin is the problem.", majorityLabel: "Most say: no — the evil twin cheated, not you" },
  { category: "Absurd", text: "You are a method actor preparing for a role as a devoted spouse. As research, you develop genuine feelings for your co-star. You don't act on them but also don't leave the role.", hint: "Art or excuse?", verdict: true, explanation: "Real feelings, regardless of how they're rationalized, create real emotional distance. Most people say the feelings — and staying in the situation — constitute a form of betrayal.", majorityLabel: "Most say: yes — the feelings are real even if the role isn't" },
  { category: "Absurd", text: "In a parallel universe, your alternate self is in a happy, faithful relationship. In this universe, you cheated. Does your parallel self's faithfulness offset your betrayal?", hint: "Theoretical. But go with it.", verdict: true, explanation: "Parallel universe morality doesn't carry over. Most people say you are fully responsible for your own choices in your own timeline.", majorityLabel: "Most say: yes — parallel you is irrelevant" },
  { category: "Absurd", text: "You kiss your partner's identical twin by accident in a dark hallway. You realize immediately and pull away, horrified.", hint: "It was genuinely, completely accidental.", verdict: false, explanation: "Intent and knowledge are prerequisites for most definitions of cheating. An accidental, immediate-correction case of mistaken identity is not infidelity.", majorityLabel: "Most say: no — accidental and corrected" },
  { category: "Absurd", text: "You are abducted by aliens. During the abduction, they probe your mind and extract all your romantic feelings — then accidentally implant someone else's affair memories into you. You are returned unchanged physically.", hint: "The aliens have apologized.", verdict: false, explanation: "Involuntary neurological tampering by extraterrestrials is an edge case most ethical frameworks don't cover. Most humans say: not your fault.", majorityLabel: "Most say: no — alien liability, not yours" },

  // --- HYPOTHETICAL ---
  { category: "Hypothetical", text: "If you knew your partner would never, ever find out — would sleeping with someone else count as cheating?", hint: "Perfect secrecy is guaranteed.", verdict: true, explanation: "Most people say cheating isn't defined by whether you're caught — it's defined by the breach of an agreement. The act is the betrayal, not the discovery.", majorityLabel: "Most say: yes — secrecy doesn't change what it is" },
  { category: "Hypothetical", text: "Your partner has been in a coma for five years with no prognosis for recovery. You fall in love with someone new. You start a relationship.", hint: "You haven't divorced. You haven't left.", verdict: false, explanation: "Most people feel deep empathy here. While technically you're still in a committed relationship, most say grief, time, and love make this a human decision, not a moral failing.", majorityLabel: "Most say: no — love after loss isn't betrayal" },
  { category: "Hypothetical", text: "You and your partner agree to an open relationship. You sleep with other people. You fall in love with one of them.", hint: "The sleeping around was allowed. The feelings were not discussed.", verdict: true, explanation: "Most people consider falling in love outside the relationship a violation even in open arrangements — unless emotional connections were explicitly permitted.", majorityLabel: "Most say: yes — feelings weren't in the agreement" },
  { category: "Hypothetical", text: "You are offered a pill that would permanently erase your feelings for your partner. You take it.", hint: "You didn't cheat. You just... opted out of love.", verdict: false, explanation: "Falling out of love — even via a pill — isn't infidelity. Most people would call this emotionally cruel but not cheating.", majorityLabel: "Most say: no — stopping love isn't cheating" },
  { category: "Hypothetical", text: "In a society where relationships are legally limited to 5 years, you and your partner's contract expires. You sleep with someone else on day one of 'free status.'", hint: "The law said you were done.", verdict: false, explanation: "In this hypothetical, the relationship legally ended. Most people say the social contract defines the loyalty obligation.", majorityLabel: "Most say: no — the contract ended the obligation" },
  { category: "Hypothetical", text: "You can upload your consciousness into a digital body. Your physical body remains in a coma. Your digital self starts a relationship with someone online.", hint: "Which version of you is the real one?", verdict: true, explanation: "If your consciousness — your self — is in the digital body, most people say that is you, and the relationship is a real betrayal.", majorityLabel: "Most say: yes — consciousness makes you responsible" },
  { category: "Hypothetical", text: "You discover your partner has been unfaithful. Before confronting them, you sleep with someone else as 'revenge.' Then you confront them.", hint: "You felt justified in the moment.", verdict: true, explanation: "Retaliatory infidelity doesn't cancel the original betrayal — it doubles it. Most people say two wrongs don't make a right and you've now both cheated.", majorityLabel: "Most say: yes — revenge affairs are still affairs" },
  { category: "Hypothetical", text: "A scientist invents a device that lets you physically feel someone else's emotions. You use it on your ex. You feel their love for you. You don't tell your partner.", hint: "You just... wanted to feel it once.", verdict: true, explanation: "Secretly seeking emotional intimacy from an ex — even via technology — and hiding it from your partner is considered a betrayal of trust by most.", majorityLabel: "Most say: yes — the secret seeking is the problem" },
  { category: "Hypothetical", text: "Your partner is terminally ill and, out of love, tells you: 'Please find someone to be happy with while I'm still here. I want that for you.' You do.", hint: "They gave explicit, loving permission.", verdict: false, explanation: "Consent changes the moral calculus entirely. With explicit permission from your partner born of love, most people say this is not cheating — it's honoring their wishes.", majorityLabel: "Most say: no — consent given freely changes everything" },
  { category: "Hypothetical", text: "You can enter a simulation so realistic that everything in it feels completely real. In the simulation, you have a full relationship — emotional, physical, years-long — with someone else. Then you exit.", hint: "No real person was involved. But every feeling was real to you.", verdict: false, explanation: "Most people land on 'no' since no real person was involved — though the emotional investment is worth reflecting on. This is genuinely contested philosophical territory.", majorityLabel: "Divided — philosophy and feelings collide here" },

  // --- SOCIAL / SITUATIONAL ---
  { category: "Social", text: "Your partner's best friend confesses they have feelings for you. You don't say anything to your partner because you don't want to cause drama.", hint: "You think it will just go away.", verdict: false, explanation: "Not reporting someone else's feelings isn't infidelity. Most people say this is a judgment call — though many would argue your partner deserves to know.", majorityLabel: "Most say: not cheating, but maybe tell them" },
  { category: "Social", text: "You go to your ex's wedding and dance with them for one slow song. It was the couple's idea.", hint: "You were invited, it was public, your partner wasn't there.", verdict: false, explanation: "A public dance at a wedding, organized by the couple, isn't infidelity. Most people say context and intent matter enormously here.", majorityLabel: "Most say: no — context makes this fine" },
  { category: "Social", text: "You compliment a stranger so effusively that they give you their number. You take it but don't use it.", hint: "You kept the number.", verdict: false, explanation: "Most people draw the line at taking a number but not using it — though the keeping is a mild yellow flag about intent.", majorityLabel: "Most say: no — though why'd you keep it?" },
  { category: "Social", text: "You and a close friend of a different gender share a bed platonically on a group trip because there aren't enough rooms. You don't tell your partner.", hint: "Nothing happened. You actively hid it.", verdict: true, explanation: "Nothing happening doesn't excuse the concealment. Most people say if you hid it, you knew it would bother your partner — which means you knew it crossed a line.", majorityLabel: "Most say: yes — the hiding is the tell" },
  { category: "Social", text: "You attend a bachelorette party and receive a lap dance from a stripper. Your partner thinks you just went to dinner.", hint: "You lied about the whole evening.", verdict: true, explanation: "Lying about where you were and what you did — even if the activity itself is debatable — is a breach of trust. Most people say the deception is what makes it cross the line.", majorityLabel: "Most say: yes — the lie is the cheating" },
  { category: "Social", text: "You run into your ex at a grocery store. You talk for an hour. You don't mention it to your partner because it doesn't feel significant enough.", hint: "Genuinely: you forgot to mention it.", verdict: false, explanation: "Not every interaction needs to be reported. Most people say a chance encounter that you didn't find noteworthy isn't a cover-up.", majorityLabel: "Most say: no — not every run-in needs reporting" },
  { category: "Social", text: "You develop a tradition of long Sunday morning calls with your childhood friend of the opposite sex. Your partner knows about them but doesn't know how deep the conversations go.", hint: "Transparent existence, hidden depth.", verdict: true, explanation: "Hiding the emotional depth of a relationship — even if the relationship itself is known — is a form of deception most people consider problematic.", majorityLabel: "Most say: yes — hiding the depth matters" },
  { category: "Social", text: "You passionately argue — for a full hour at a party — for the philosophy that monogamy is unnatural, while your partner is standing next to you.", hint: "It's an intellectual position. Delivered loudly.", verdict: false, explanation: "Holding philosophical views about relationship structures isn't infidelity. Most people say arguing an idea in public isn't betrayal — though your partner might want a heads up next time.", majorityLabel: "Most say: no — that's just an opinion" },

  // --- LONG-TERM RELATIONSHIP ---
  { category: "Long-term", text: "After 15 years together, you tell someone at a conference that you're single. You don't follow up with them. You just... wanted to feel that freedom for a moment.", hint: "You went home to your partner that night.", verdict: true, explanation: "Most people say deliberately presenting yourself as available — even briefly — is a form of emotional infidelity and disrespect to a long-term partner.", majorityLabel: "Most say: yes — the desire to erase them is the betrayal" },
  { category: "Long-term", text: "You and your partner haven't been physically intimate in three years. You masturbate thinking about an old flame. You feel guilty.", hint: "Guilt suggests you think it matters.", verdict: false, explanation: "Fantasy is private and involuntary. Most people say this is completely normal — the guilt is interesting, but the act itself isn't cheating.", majorityLabel: "Most say: no — everyone has a private mind" },
  { category: "Long-term", text: "You realize you've fallen out of love with your partner but stay with them for financial reasons. You meet someone new and feel alive again. You don't act on it.", hint: "You feel trapped. The feelings are real.", verdict: false, explanation: "Feelings without action aren't infidelity. Most people would say the problem here is the relationship you're staying in — not the feelings you're having.", majorityLabel: "Most say: no — staying and feeling isn't cheating" },
  { category: "Long-term", text: "You've been secretly funding your ex's life for two years — helping them with rent, groceries, emergencies. Your partner doesn't know.", hint: "No romance, just support.", verdict: true, explanation: "Most people say this level of secret, sustained involvement with an ex — financially or otherwise — is a form of emotional betrayal, even without romance.", majorityLabel: "Most say: yes — secret support this deep is a problem" },
  { category: "Long-term", text: "You and your partner have agreed to never look through each other's phones. You break that agreement because you suspect infidelity — and you're right.", hint: "You were right. Does that matter?", verdict: false, explanation: "Most people say breaking the agreement was wrong — but finding actual evidence of infidelity changes the moral weight significantly. Being right doesn't make snooping fine, but it does reframe it.", majorityLabel: "Divided — right for wrong reasons" },
  { category: "Long-term", text: "For years, you've been in love with someone other than your partner but never acted. You've raised a family, stayed committed. On your deathbed you tell your partner the truth.", hint: "Your whole relationship was lived faithfully. But honestly?", verdict: false, explanation: "A lifetime of faithful action despite unexpressed feelings is, by most people's definition, not cheating. The deathbed confession is hurtful — but the living was not a betrayal.", majorityLabel: "Most say: no — you lived faithfully" },

  // --- MARRIAGE SPECIFIC ---
  { category: "Marriage", text: "You're unhappily married. You begin emotionally connecting with someone at work over months. You never act physically. You eventually leave your spouse for this person.", hint: "No physical contact. But you left for them.", verdict: true, explanation: "An emotional affair that leads you to leave your spouse is still an affair. Most people say the relationship overlap — even without physical contact — is betrayal.", majorityLabel: "Most say: yes — emotional affairs are real affairs" },
  { category: "Marriage", text: "You sleep with someone at your bachelor/bachelorette party two nights before your wedding.", hint: "You went through with the wedding.", verdict: true, explanation: "This is nearly universally considered cheating — you were already committed, and two days from formalizing it. Most people see no meaningful distinction from being married at this point.", majorityLabel: "Most say: yes — engaged is committed" },
  { category: "Marriage", text: "You're in an arranged marriage. You've never loved your spouse. You fall in love with someone else and have an affair.", hint: "Your feelings are genuine. So is the marriage contract.", verdict: true, explanation: "Regardless of the circumstances of a marriage, most people say an affair is a breach of the commitment made — even one made without love.", majorityLabel: "Most say: yes — the contract was real regardless" },
  { category: "Marriage", text: "You and your spouse have been separated for 18 months, waiting for divorce paperwork. You start dating someone new.", hint: "The ink just isn't dry yet.", verdict: false, explanation: "Most people say a genuine, prolonged separation with divorce underway is essentially the end of the relationship. Starting over before the paperwork is widely seen as acceptable.", majorityLabel: "Most say: no — separated means it's over" },
  { category: "Marriage", text: "You tell your spouse you love them every day. You mean it every time. But you also love someone else — deeply, truly, equally. You've told no one.", hint: "You believe you genuinely love two people.", verdict: true, explanation: "Concealing a second deep love from a monogamous partner is a form of betrayal, even if the feelings are genuine. Most people say honesty is owed.", majorityLabel: "Most say: yes — the secret love is the problem" },

  // --- UNUSUAL CIRCUMSTANCES ---
  { category: "Unusual", text: "You're a spy. Seducing a target was part of your mission. You had no choice — it was sanctioned by your government.", hint: "You did it for your country.", verdict: true, explanation: "Most people say professional obligation doesn't dissolve personal loyalty. Unless your partner knew and consented to this being part of your job, it's still a betrayal of the relationship.", majorityLabel: "Most say: yes — country doesn't override commitment" },
  { category: "Unusual", text: "You were hypnotized at a show and kissed a stranger on stage. You have no memory of it. It was filmed. Your partner saw it later.", hint: "You genuinely have no memory.", verdict: false, explanation: "No consciousness, no consent, no control. Most people say this is not infidelity — it's a bizarre situation that requires compassion, not judgment.", majorityLabel: "Most say: no — no agency, no betrayal" },
  { category: "Unusual", text: "You're a romance novelist. Your main character is based on someone you used to love. Every intimate scene you write for them comes from real memory.", hint: "Art or lingering attachment?", verdict: false, explanation: "Creative work drawing on memory is part of writing. Most people don't consider this cheating — though it might be worth reflecting on why those memories are so vivid.", majorityLabel: "Most say: no — that's just craft" },
  { category: "Unusual", text: "Your relationship opened up briefly during a rough patch. You slept with someone. The relationship closed again. You stayed together. Neither of you mentions it anymore.", hint: "You both agreed. It's over. Or is it?", verdict: false, explanation: "Both parties consented, and both have moved on. Most people say consented experiences don't become retroactive betrayals.", majorityLabel: "Most say: no — consent was given at the time" },
  { category: "Unusual", text: "You ghosted your partner for two weeks — no contact, no explanation. You were alive and fine. You just needed space.", hint: "You came back like nothing happened.", verdict: false, explanation: "Ghosting is cruel and cowardly — but most people separate 'being a bad partner' from 'cheating.' Disappearing isn't infidelity; it's abandonment.", majorityLabel: "Most say: not cheating — but deeply wrong" },
  { category: "Unusual", text: "You accidentally send a flirty text meant for your partner to someone else. That someone else flirts back. You flirt back at them once before realizing the mistake.", hint: "One exchange. Then you stopped.", verdict: false, explanation: "A single confused exchange before course-correction is a mistake, not a sustained betrayal. Most people say intent and correction matter.", majorityLabel: "Most say: no — mistakes with quick correction don't count" },
  { category: "Unusual", text: "You discover your partner is in a relationship with someone else. Before confronting them, you hire a private investigator to gather evidence. Is hiring the PI cheating?", hint: "You haven't done anything to anyone else.", verdict: false, explanation: "Investigating a suspected betrayal isn't itself infidelity. Most people say protecting yourself from deception is reasonable — legally and morally.", majorityLabel: "Most say: no — investigating isn't betraying" },

  // --- CULTURAL / PHILOSOPHICAL ---
  { category: "Philosophical", text: "You and your partner are polyamorous. You fall in love with a third person. Then your partner — without telling you — falls in love with a fourth. Is that cheating within a polyamorous relationship?", hint: "Even open relationships have rules.", verdict: true, explanation: "Polyamory has agreements too. Going outside those agreements — hiding a new relationship in an open one — is still a breach of trust and widely considered cheating within that framework.", majorityLabel: "Most say: yes — agreements apply in poly relationships too" },
  { category: "Philosophical", text: "In your culture, it is expected that married men have mistresses. Your wife grew up in this culture too. You have one. She's always known this was likely.", hint: "Cultural expectation isn't explicit consent.", verdict: true, explanation: "Cultural norms don't eliminate individual consent. Most people say an implicit cultural expectation isn't the same as a genuine agreement — and the betrayal of trust still stands.", majorityLabel: "Most say: yes — cultural norms aren't consent" },
  { category: "Philosophical", text: "You believe that love is infinite and you are capable of loving many people simultaneously. You act on this belief without telling your partner.", hint: "It's a deeply held philosophical conviction.", verdict: true, explanation: "Your beliefs about love don't override your partner's right to know the terms of the relationship they're in. Most people say unilateral philosophical action is still betrayal.", majorityLabel: "Most say: yes — beliefs don't replace consent" },
  { category: "Philosophical", text: "You believe your current relationship is karmic — you've loved this person across many past lives. Based on this belief, you feel a 'soul connection' with a stranger that must be honored. You pursue it.", hint: "It's spiritual, not lustful — to you.", verdict: true, explanation: "Spiritual framing doesn't change the real-world impact. Most people say rationalizing an affair through metaphysics is still an affair.", majorityLabel: "Most say: yes — spiritual framing doesn't change the act" },

  // --- FUN / PLAYFUL ---
  { category: "Fun", text: "Your celebrity crush follows you back on Instagram. You spend three hours crafting a reply. You don't tell your partner.", hint: "This is genuinely exciting to you.", verdict: false, explanation: "Excitement about a celebrity — even interactive — is not infidelity. Most people say enjoying a celebrity moment privately is completely normal.", majorityLabel: "Most say: no — celebrity interactions don't count" },
  { category: "Fun", text: "You rate other people on a 'hotness scale' in your head, constantly, including people you'd never pursue. You've been doing this your whole relationship.", hint: "It's an internal monologue your partner doesn't know about.", verdict: false, explanation: "Internal aesthetic assessments are universal and involuntary. Most people say noticing attractiveness is human, not betrayal.", majorityLabel: "Most say: no — internal ratings are just being human" },
  { category: "Fun", text: "You and your partner have a specific celebrity 'hall pass' agreement. You unexpectedly meet that celebrity. They're interested. You don't take the pass.", hint: "You could have. You chose not to.", verdict: false, explanation: "You were within your agreed rights and chose not to act. Most people say not using a hall pass is admirably faithful.", majorityLabel: "Most say: no — and honestly, good for you" },
  { category: "Fun", text: "Same scenario — but this time you DO take the hall pass.", hint: "This is what you both agreed to.", verdict: false, explanation: "A consensual hall pass agreement is a form of negotiated non-monogamy. If both partners genuinely agreed, most people say it's not cheating.", majorityLabel: "Most say: no — you both agreed to this" },
  { category: "Fun", text: "You win a kissing booth at a charity carnival. You are the prize. Your partner is in the crowd watching. You kiss 47 people for $5 each.", hint: "It's for charity. Your partner agreed.", verdict: false, explanation: "Consensual participation in a public, charitable context with your partner present and agreeing is about as un-cheating as it gets.", majorityLabel: "Most say: no — charitable and consensual" },
  { category: "Fun", text: "You tell your friends your partner's most embarrassing secret at a dinner party, to get a laugh. Everyone laughs. You feel great.", hint: "Your partner finds out.", verdict: false, explanation: "Betraying someone's private embarrassment for social currency is a real breach of trust — but most people categorize it as 'being a bad partner,' not infidelity.", majorityLabel: "Most say: not cheating — but deeply uncool" },
  { category: "Fun", text: "You give a fake number to someone hitting on you at a bar. The number is your ex's number.", hint: "Petty, arguably creative.", verdict: false, explanation: "Most people see this as a harmless deflection — slightly chaotic, not romantic betrayal. You rejected someone; you just had a quirky method.", majorityLabel: "Most say: no — you were deflecting, not betraying" },

  // --- ONLINE DATING ERA ---
  { category: "Modern Dating", text: "You and someone you're casually dating have been seeing each other for 6 weeks. You haven't had 'the talk.' You kiss someone else at a party.", hint: "No exclusivity agreement exists.", verdict: false, explanation: "Without an explicit exclusivity agreement, most people say you're both still free to see others. The 'talk' creates the commitment.", majorityLabel: "Most say: no — no talk, no rules" },
  { category: "Modern Dating", text: "You've had the exclusivity talk. The next day, before fully processing it, you hook up with someone you'd already made plans with.", hint: "The talk was yesterday. The plans were from last week.", verdict: true, explanation: "Once an explicit agreement exists, it applies. Most people say 'I made plans before the talk' isn't a valid exception the day after.", majorityLabel: "Most say: yes — agreements apply from when you make them" },
  { category: "Modern Dating", text: "You keep your dating app installed but don't actively use it. You tell yourself it's 'just in case' while in an exclusive relationship.", hint: "You haven't deleted it. You haven't used it.", verdict: false, explanation: "Having an app installed without using it is passive. Most people say it's a bad sign — but inaction isn't infidelity.", majorityLabel: "Most say: not cheating — but delete it" },
  { category: "Modern Dating", text: "You meet someone on a dating app. It gets serious. You remove your profile but your partner leaves theirs up. You find out three months in. Is your partner cheating?", hint: "Profile visible. No active conversations found.", verdict: false, explanation: "A forgotten or passive profile — without active use — falls short of most people's definition of cheating. But it's a conversation that needs to happen.", majorityLabel: "Divided — context matters a lot here" },
  { category: "Modern Dating", text: "You create a fake dating profile using photos of a random person, just to see what the 'other side' of dating apps looks like. You match with someone and chat briefly.", hint: "You're not using your identity. You're not meeting anyone.", verdict: false, explanation: "Most people separate catfishing (which is wrong to the catfished person) from infidelity toward a partner. You weren't being yourself — so technically, you weren't there.", majorityLabel: "Most say: not cheating — but ethically messy" },

  // --- HEARTBREAKERS ---
  { category: "Heartbreaker", text: "You are your partner's first love. You know you're not in love with them. You stay for two more years out of guilt.", hint: "You were never going to stay forever.", verdict: false, explanation: "Staying out of misplaced kindness is painful and arguably wrong — but it's not cheating. Most people say it's a different kind of harm.", majorityLabel: "Most say: not cheating — just not brave enough to leave" },
  { category: "Heartbreaker", text: "You have been deeply in love with your partner's sibling for years. You've never said or done anything. Your partner knows nothing.", hint: "You've carried this alone.", verdict: false, explanation: "Feelings, especially unacted-upon ones, aren't betrayal. This is an extraordinary situation of pain — but most people say suffering in silence isn't infidelity.", majorityLabel: "Most say: no — feeling isn't betraying" },
  { category: "Heartbreaker", text: "You stay in your relationship partly because leaving would devastate your partner, not because you want to stay. You're emotionally checked out.", hint: "You're acting out of pity, not love.", verdict: false, explanation: "Staying out of pity is emotionally complex and arguably unfair — but not cheating. Most people say it's a form of avoidance, not infidelity.", majorityLabel: "Most say: not cheating — but not kind either" },
  { category: "Heartbreaker", text: "You are cheating on your partner. You feel terrible. You stay because you love them and don't want to lose them. You continue cheating.", hint: "Love and betrayal, simultaneously.", verdict: true, explanation: "Continuing an affair while staying in a relationship is sustained cheating, regardless of the emotional complexity or genuine love you feel.", majorityLabel: "Most say: yes — ongoing betrayal regardless of feelings" },
  { category: "Heartbreaker", text: "You cheat on your partner. You confess immediately. You beg forgiveness. You promise it will never happen again. It happens again.", hint: "Lightning struck twice.", verdict: true, explanation: "A repeated betrayal after explicit confession and promises is widely considered worse than the first. Most people have no ambiguity here.", majorityLabel: "Most say: yes — and worse than the first time" },

  // --- GRAY ZONE ---
  { category: "Gray Zone", text: "Your partner sleepwalks and, in a documented episode, sends romantic texts to an old contact. They have no memory of it.", hint: "It's happened before — the sleepwalking, not the texting.", verdict: false, explanation: "Truly unconscious behavior without awareness or intent is not considered cheating by most people — it's a medical phenomenon requiring compassion, not judgment.", majorityLabel: "Most say: no — sleep is not consent or action" },
  { category: "Gray Zone", text: "You are on medication that, as a documented side effect, causes hypersexuality. You act on these impulses with someone other than your partner.", hint: "Your doctor warned you this could happen.", verdict: true, explanation: "This is genuinely contested. Most people still say the act is a breach of trust — though the context significantly changes how they feel about culpability.", majorityLabel: "Divided — culpability is real but complicated" },
  { category: "Gray Zone", text: "You agree to do a couples challenge online where you rate how attractive strangers are. Your partner suggests it. You rate someone a 10.", hint: "Your partner is watching. This was their idea.", verdict: false, explanation: "A consensual, partner-initiated game where you both participate together is about as transparent as it gets. Most people say this is clearly fine.", majorityLabel: "Most say: no — they literally asked you to do it" },
  { category: "Gray Zone", text: "You help an old flame move apartments. You spend the whole day together. It's completely platonic. Your partner doesn't know you helped.", hint: "You didn't lie. You just didn't mention it.", verdict: false, explanation: "Not volunteering every detail of your day isn't deception. Most people say not mentioning something innocent isn't a cover-up.", majorityLabel: "Most say: no — omission of innocent things is fine" },
  { category: "Gray Zone", text: "Your partner asks you to stop talking to a specific person. You agree. You keep talking to them, secretly.", hint: "You gave your word.", verdict: true, explanation: "Breaking an explicit agreement made to your partner — regardless of whether you think the request was reasonable — is a violation of trust. Most people say your word matters.", majorityLabel: "Most say: yes — you gave your word" },
  { category: "Gray Zone", text: "You pay for an adult content creator's subscription and send them a personalized, flirtatious message. They respond with a scripted, automated reply.", hint: "It's a transaction. You know this.", verdict: false, explanation: "Most people consider this a transactional interaction, not infidelity — though hiding significant spending or emotional investment from a partner would be different.", majorityLabel: "Most say: no — transactional ≠ betrayal" },
  { category: "Gray Zone", text: "You confess your attraction to someone to a close friend and say 'I would, if I could.' You never act. Your partner never finds out.", hint: "Saying it out loud felt dangerously real.", verdict: false, explanation: "Expressing feelings to a trusted friend isn't acting on them. Most people say venting attraction in confidence isn't the same as pursuing it.", majorityLabel: "Most say: no — saying it isn't doing it" },
  { category: "Gray Zone", text: "You write your partner a love letter. You realize halfway through that it's more accurately addressed to someone else. You finish it, change the name, and give it to your partner.", hint: "Every word was true. For someone else.", verdict: true, explanation: "Giving your partner a love letter originally written for someone else is a form of emotional misdirection most people consider a quiet betrayal — the intimacy was real, but misaddressed.", majorityLabel: "Most say: yes — that letter wasn't really for them" },
  { category: "Gray Zone", text: "You have been in a secret emotional affair for 6 months. You end it. You never tell your partner. You spend the next decade being a perfect, devoted partner.", hint: "It's over. You're different now.", verdict: true, explanation: "Most people say past infidelity, even fully resolved, still represents a truth your partner deserves to know — though many acknowledge this is one of life's most contested questions.", majorityLabel: "Divided — past perfect doesn't erase past truth" },

  // ── BATCH 2: 100 NEW SCENARIOS ──

  // --- NEW: Body & Physical ---
  { category: "Physical", text: "You make out with someone at a club for about thirty seconds before stopping yourself. You tell yourself it doesn't count because it wasn't sex.", hint: "You've been using this logic for a while.", verdict: true, explanation: "Physical intimacy with someone outside your relationship is cheating regardless of how far it goes. Most people reject the 'it wasn't sex' loophole entirely.", majorityLabel: "Most say: yes — making out is still cheating" },
  { category: "Physical", text: "You and your partner have been long-distance for a year. You sleep in the same bed as a close friend during a trip — fully clothed, nothing happens.", hint: "You don't mention it because you know it'll start a fight.", verdict: false, explanation: "Sharing a bed platonically isn't infidelity. Most people say the issue here is the preemptive hiding — but the act itself isn't cheating.", majorityLabel: "Most say: not cheating — but tell them anyway" },
  { category: "Physical", text: "You get a full-body massage from an attractive stranger at a spa. You enjoy it more than you expected. You book another one without telling your partner.", hint: "It was a licensed spa. Nothing inappropriate happened.", verdict: false, explanation: "A professional massage is not infidelity. Most people say booking a spa treatment privately isn't a betrayal — the enjoyment is irrelevant.", majorityLabel: "Most say: no — it was a professional service" },
  { category: "Physical", text: "You slow-dance with someone at a wedding. The song goes on for a long time. You both hold on a little longer than the music requires.", hint: "Your partner was in the bathroom.", verdict: false, explanation: "A lingering dance is ambiguous, not infidelity. Most people say physical proximity with no follow-up is not cheating — though it might be worth examining why you held on.", majorityLabel: "Most say: no — a long dance isn't betrayal" },
  { category: "Physical", text: "You kiss your best friend on New Year's Eve at midnight. Both of you were drunk. You've never spoken about it since.", hint: "You told yourself everyone kisses at midnight.", verdict: true, explanation: "Kissing someone outside your relationship — even once, even briefly — is still cheating. Most people say the occasion and the alcohol don't change the act.", majorityLabel: "Most say: yes — a kiss is a kiss" },
  { category: "Physical", text: "Your partner dares you to kiss a friend as part of a party game. You do it. Everyone laughs. Your partner seems fine with it.", hint: "They literally dared you.", verdict: false, explanation: "Explicit, cheerful permission from your partner in a playful context is about as consensual as it gets. Most people say this is clearly fine.", majorityLabel: "Most say: no — they literally dared you" },
  { category: "Physical", text: "You get a Brazilian wax specifically because someone at the gym complimented your body and you wanted to look good for them. You've never told your partner this.", hint: "You haven't done anything yet.", verdict: false, explanation: "Grooming for reasons you don't fully disclose is not infidelity. Most people say motivation behind self-care, however awkward, isn't cheating.", majorityLabel: "Most say: no — grooming intentions aren't betrayal" },
  { category: "Physical", text: "You hold hands with an ex during an emotional conversation. They were crying. It felt natural. You let go after a minute.", hint: "It was a moment of human comfort.", verdict: false, explanation: "Brief physical comfort given to an ex in a moment of distress is not cheating to most people — context and intent matter enormously here.", majorityLabel: "Most say: no — comfort isn't romantic" },

  // --- NEW: Words & Confessions ---
  { category: "Words", text: "Drunk at a party, you tell someone you'd 'definitely date them in another life.' You mean it. You never see them again.", hint: "In vino veritas?", verdict: false, explanation: "Hypothetical flirting under the influence, without follow-through, is widely seen as embarrassing rather than infidelity. Most people give this a pass.", majorityLabel: "Most say: no — drunk hypotheticals don't count" },
  { category: "Words", text: "You write a song about someone you're attracted to. It's beautiful. Your partner thinks you wrote it about them. You don't correct this assumption.", hint: "You let them believe something false.", verdict: true, explanation: "Deliberately letting your partner believe false intimacy exists where it doesn't is a form of deception. Most people say allowing the misattribution is a quiet betrayal.", majorityLabel: "Most say: yes — letting them believe a lie is a lie" },
  { category: "Words", text: "You tell someone at a bar that your partner is 'just a roommate.' Nothing comes of it. You go home alone.", hint: "You wanted to see how it felt.", verdict: true, explanation: "Erasing your partner from your identity to feel available — even without acting — is considered disloyal by most people.", majorityLabel: "Most say: yes — erasing them is disrespectful" },
  { category: "Words", text: "You leave a glowing, flirtatious comment on a stranger's Instagram photo. Your partner has no idea you do this regularly.", hint: "It's public. Anyone can see it. But your partner doesn't.", verdict: false, explanation: "Public compliments are generally not considered cheating. Most people say flirtatious comments, however frequent, aren't infidelity — though your partner might disagree.", majorityLabel: "Divided — most say no, but it's a yellow flag" },
  { category: "Words", text: "You call out a name that isn't your partner's during an intimate moment. You claim it was your pet's name. It wasn't.", hint: "You lied immediately, fluently, and convincingly.", verdict: true, explanation: "The wrong name, plus the cover lie, is a double breach of trust. Most people say both the slip and the cover-up count.", majorityLabel: "Most say: yes — the lie made it worse" },
  { category: "Words", text: "You describe your relationship to a therapist as 'essentially over' even though you and your partner haven't discussed breaking up.", hint: "You said it out loud before you admitted it to yourself.", verdict: false, explanation: "Being honest with a therapist about your private emotional state isn't betrayal. Most people say therapy is the right place for this kind of confession.", majorityLabel: "Most say: no — that's what therapy is for" },
  { category: "Words", text: "You tell your ex 'I miss you' over text, late at night. Nothing follows. You delete the message.", hint: "You meant it. You panicked. You deleted it.", verdict: true, explanation: "A sincere, secret expression of longing toward an ex — followed by a cover-up — is considered a breach of emotional loyalty by most people.", majorityLabel: "Most say: yes — missing them + hiding it = problem" },

  // --- NEW: Online & Tech ---
  { category: "Digital", text: "You create a whole fake persona online — different name, different city — and flirt extensively with strangers. You never meet any of them or exchange photos.", hint: "Your real identity is completely hidden.", verdict: true, explanation: "Sustained, intentional romantic deception of strangers is a form of emotional infidelity even when anonymous. Most people say the secrecy and the scale make it a betrayal.", majorityLabel: "Most say: yes — the scale and secrecy make it cheating" },
  { category: "Digital", text: "You use your partner's streaming account and spend two hours watching a show with someone over video call without telling your partner.", hint: "It was just TV. Together. Remotely.", verdict: false, explanation: "Watching TV remotely with a friend, even using a shared account, isn't infidelity. Most people say this is completely unremarkable.", majorityLabel: "Most say: no — that's just watching TV" },
  { category: "Digital", text: "You 'like' every single photo your ex posts. Always within minutes. You've never missed one in two years.", hint: "It's 'just' Instagram.", verdict: false, explanation: "Social media engagement is ambiguous — but most people say liking photos, even obsessively, isn't cheating. It's attachment. Possibly an unhealthy one.", majorityLabel: "Most say: not cheating — but maybe log off" },
  { category: "Digital", text: "You video call someone you have feelings for from your car, in your driveway, so your partner inside the house doesn't know.", hint: "The location choice was deliberate.", verdict: true, explanation: "The deliberate secrecy of hiding a call from your partner at home is the tell. Most people say you wouldn't be in the driveway if the call were innocent.", majorityLabel: "Most say: yes — driveway calls are sneaky for a reason" },
  { category: "Digital", text: "You use a friend's phone to look up your ex on social media because you've blocked yourself from doing so on your own devices.", hint: "You built a fence. Then you climbed it.", verdict: false, explanation: "Circumventing a self-imposed block is a sign of lingering attachment — but most people say looking at a profile isn't cheating.", majorityLabel: "Most say: not cheating — but you know why you blocked them" },
  { category: "Digital", text: "You're in a long-distance relationship. You have explicit video calls with your partner regularly. You screenshot one without asking.", hint: "You saved it. They don't know.", verdict: true, explanation: "Capturing intimate images of a partner without consent is a serious violation of trust and in many places illegal. Most people say this is a clear betrayal.", majorityLabel: "Most say: yes — consent is non-negotiable" },
  { category: "Digital", text: "You spend hours reading your ex's old blog, which is public, trying to find references to yourself.", hint: "It's public. But you're doing it obsessively and secretly.", verdict: false, explanation: "Reading publicly available content — even obsessively — isn't infidelity. Most people say this is a bit sad, but not betrayal.", majorityLabel: "Most say: no — it's public. Still, maybe close the tab." },

  // --- NEW: Emotional Depth ---
  { category: "Emotional", text: "You cry about someone who isn't your partner. Alone, in the shower, regularly, for months.", hint: "Your partner has no idea.", verdict: false, explanation: "Grief and unexpressed longing aren't choices. Most people say crying privately for someone isn't cheating — it may be a sign you need to have a bigger conversation.", majorityLabel: "Most say: no — private grief isn't betrayal" },
  { category: "Emotional", text: "Your partner is going through something hard. You find yourself turning to someone else for emotional support instead of being present for your partner.", hint: "You're leaning on a third party when your partner needs you.", verdict: true, explanation: "Emotional withdrawal from a partner in crisis, directed toward someone else, is considered a form of emotional infidelity by most — especially when kept secret.", majorityLabel: "Most say: yes — emotional absence at the worst time matters" },
  { category: "Emotional", text: "You plan imaginary future vacations with someone you have feelings for — in your head, in vivid detail, multiple times a week.", hint: "It's all completely internal.", verdict: false, explanation: "Imagination is uncontrollable and private. Most people say internal fantasy — however detailed — isn't cheating.", majorityLabel: "Most say: no — imagination isn't infidelity" },
  { category: "Emotional", text: "You compare your partner to someone else — unfavorably and constantly — in your own mind. You'd never say it. But you think it every day.", hint: "Unfair, but silent.", verdict: false, explanation: "Internal comparisons, however unkind, are not infidelity. Most people say you're allowed private thoughts — even unkind ones.", majorityLabel: "Most say: no — private thoughts aren't betrayal" },
  { category: "Emotional", text: "You realize you've been unconsciously mirroring the mannerisms of someone you have feelings for — their laugh, their phrases. Your partner notices and finds it strange.", hint: "You didn't notice you were doing it.", verdict: false, explanation: "Unconscious mirroring is a sign of emotional connection — but most people say it isn't intentional betrayal. You didn't choose it.", majorityLabel: "Most say: no — unconscious behavior isn't infidelity" },
  { category: "Emotional", text: "You dedicate an anonymous blog to processing your feelings for someone who isn't your partner. Hundreds of strangers read it. Your partner doesn't know it exists.", hint: "Public feelings, hidden identity.", verdict: true, explanation: "Most people say sustaining and publishing an emotional attachment to someone else — even anonymously — while hiding it from your partner crosses into emotional infidelity territory.", majorityLabel: "Most say: yes — publishing a secret love is still a secret love" },

  // --- NEW: Absurd / Surreal ---
  { category: "Absurd", text: "You fall in love with a character in a book. You read it seventeen times. You sleep with the book under your pillow.", hint: "It's fiction. But the feelings aren't.", verdict: false, explanation: "Falling in love with fictional characters is a deeply human experience. Most people say no real person was involved, so no real betrayal occurred.", majorityLabel: "Most say: no — fictional love doesn't count" },
  { category: "Absurd", text: "Scientists merge your body temporarily with a stranger for 48 hours as part of a shared-consciousness experiment. During that time, the stranger has romantic feelings for someone. You experience those feelings as if they were your own.", hint: "You were scientifically fused. The feelings weren't yours.", verdict: false, explanation: "Involuntary shared consciousness is the universe's problem, not yours. Most people say you can't be held responsible for another person's feelings experienced via forced merger.", majorityLabel: "Most say: no — science fused you, not love" },
