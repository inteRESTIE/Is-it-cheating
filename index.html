  { category: "Absurd", text: "You are a ghost. You haunt your ex's apartment and watch them live their life. You can't interact with the physical world. Your living partner has no idea.", hint: "You're dead. Does commitment survive death?", verdict: false, explanation: "Death typically ends contractual obligations, including romantic ones. Most people say ghostly surveillance is creepy but not technically cheating.", majorityLabel: "Most say: no — death ends the contract. The haunting is a separate issue." },
  { category: "Absurd", text: "You are reincarnated and in your new life you fall in love with someone new. You have no memory of your past life or past partner.", hint: "Reincarnation reset everything.", verdict: false, explanation: "Without memory, identity, or continuity, there's no agreement to break. Most people say a clean-slate reincarnation means a clean slate on commitments.", majorityLabel: "Most say: no — you're literally a new person" },
  { category: "Absurd", text: "A reality TV show puts you on a deserted island with an attractive stranger for 30 days. Your partner signed the consent form. You develop genuine feelings but don't act on them.", hint: "They signed the form. The feelings were unplanned.", verdict: false, explanation: "Your partner consented to the situation. Developing feelings you don't act on isn't infidelity — especially when the setup was agreed to.", majorityLabel: "Most say: no — consent covered the situation" },
  { category: "Absurd", text: "You are transformed into a cat for one week by an incompetent witch. A human finds you attractive and pets you excessively. You purr.", hint: "You were a cat. You had no choice.", verdict: false, explanation: "You were a cat. Most people agree you cannot be held morally responsible for feline responses to affection while in cat form.", majorityLabel: "Most say: no — you were a cat. Purring is just purring." },
  { category: "Absurd", text: "Your partner's doppelganger from a parallel dimension crosses over and falls in love with you. You spend a week with them, fully aware they're not your partner. Nothing physical happens.", hint: "Same face. Different person. You knew.", verdict: true, explanation: "You knowingly spent an emotionally intimate week with someone — regardless of their face. Most people say the awareness makes it a choice, not an accident.", majorityLabel: "Most say: yes — you knew they weren't your partner" },
  { category: "Absurd", text: "In a post-apocalyptic world, your partner is presumed dead. You start a relationship with someone new. Your partner turns out to be alive.", hint: "You had every reason to believe they were gone.", verdict: false, explanation: "Acting in good faith after a reasonable belief in death is not infidelity. Most people say you cannot be blamed for moving on when you had no way to know.", majorityLabel: "Most say: no — good faith grief isn't betrayal" },
  { category: "Absurd", text: "You attend a masquerade ball and have a deeply romantic, anonymous connection with someone — dancing, talking for hours, almost kissing. You never learn who they are. Neither does your partner.", hint: "It stayed at 'almost.'", verdict: false, explanation: "An almost-kiss with an anonymous stranger, without follow-through, sits in gray territory — but most people land on 'not cheating' given the anonymity and the line not crossed.", majorityLabel: "Most say: no — 'almost' and anonymous are both meaningful" },

  // --- NEW: Hypothetical ---
  { category: "Hypothetical", text: "If you could take a pill that made you incapable of ever feeling attracted to anyone but your partner, would refusing to take it count as cheating?", hint: "The pill exists. You choose not to take it.", verdict: false, explanation: "Choosing not to alter your natural human capacity for attraction is not infidelity. Most people say refusing a pill isn't the same as acting on feelings.", majorityLabel: "Most say: no — keeping your humanity isn't cheating" },
  { category: "Hypothetical", text: "You're in a simulation — you know you're in one. In the simulation, you have an affair. When you exit, do you owe your partner a confession?", hint: "You knew it was fake. The choices still felt real.", verdict: false, explanation: "If you knew it was a simulation throughout, most people say the real-world relationship was never at risk. The simulation was the context; your partner wasn't there.", majorityLabel: "Most say: no — if you knew, the simulation was the frame" },
  { category: "Hypothetical", text: "Your partner is offered a job on another planet. They take it. You can video call but will never be in the same room again. You eventually fall in love with someone on Earth.", hint: "They chose to leave.", verdict: false, explanation: "An effectively permanent planetary separation with no physical future together leads most people to consider moving on a human necessity rather than betrayal.", majorityLabel: "Most say: no — interplanetary separation is a special case" },
  { category: "Hypothetical", text: "You can see the future. You see that you will cheat on your partner in 3 years. You don't tell them. You don't break up. You wait.", hint: "The future is certain. You stayed anyway.", verdict: true, explanation: "Most people say knowingly waiting for a betrayal you could prevent — without warning your partner — is itself a form of deception and disrespect.", majorityLabel: "Most say: yes — knowing and staying silent is its own betrayal" },
  { category: "Hypothetical", text: "In an alternate universe where marriage doesn't exist and relationships have no formal commitment, you sleep with someone while emotionally partnered with another person.", hint: "No rules exist in this universe.", verdict: false, explanation: "Without formal commitment structures, the definition of betrayal collapses. Most people say you can only cheat against an agreement that exists.", majorityLabel: "Most say: no — no commitment, no betrayal" },
  { category: "Hypothetical", text: "You're offered $10 million to spend one night with someone. You would give all the money to your partner. You accept.", hint: "Your partner doesn't know about the offer or the night.", verdict: true, explanation: "Financial motivation doesn't change the nature of the act. Most people say sleeping with someone without your partner's knowledge is cheating regardless of the payout.", majorityLabel: "Most say: yes — money doesn't change what it is" },
  { category: "Hypothetical", text: "You swap bodies with your best friend for a week. While in their body, their partner tries to kiss you. You let it happen because you thought it would be awkward to explain.", hint: "It was their body. But your choice.", verdict: true, explanation: "You were in control of the decision — regardless of whose body. Most people say consenting to a kiss, even in borrowed form, was your choice to make.", majorityLabel: "Most say: yes — it was still your decision" },

  // --- NEW: Marriage & Commitment ---
  { category: "Marriage", text: "You write your own wedding vows and quietly omit 'forsaking all others' because you weren't sure you could commit to it.", hint: "You said the vows. You quietly changed them.", verdict: true, explanation: "Most people say deliberately omitting fidelity from your vows while letting your partner assume they were included is a form of deception from the very start.", majorityLabel: "Most say: yes — omitting it was a quiet lie" },
  { category: "Marriage", text: "You maintain a close friendship with someone your spouse has explicitly asked you not to see. You believe the request was unreasonable. Nothing romantic has happened.", hint: "You disagree with the boundary. You crossed it.", verdict: true, explanation: "Whether the request was reasonable or not, breaking an explicit agreement with your spouse is a breach of trust. Most people say the unilateral decision is the problem.", majorityLabel: "Most say: yes — breaking the agreement is the betrayal" },
  { category: "Marriage", text: "You get a tattoo of someone else's name in a place your spouse will never see.", hint: "Hidden, permanent, someone else's name.", verdict: true, explanation: "A hidden tattoo of another person's name is a deeply personal act of emotional investment most people consider a form of quiet betrayal.", majorityLabel: "Most say: yes — hidden devotion to another is still devotion" },
  { category: "Marriage", text: "You name your pet after your ex without telling your spouse. You use the name lovingly every day.", hint: "Your spouse thinks it's just a name.", verdict: false, explanation: "Pet names are usually arbitrary. Most people say this is an odd private attachment but not infidelity — unless the intent was clearly romantic.", majorityLabel: "Most say: no — naming a pet is odd, not betrayal" },
  { category: "Marriage", text: "You and your spouse disagree on whether to have children. Without telling them, you stop using contraception to 'let fate decide.'", hint: "You made a reproductive decision alone.", verdict: true, explanation: "Unilaterally altering contraception in a relationship is a profound violation of bodily autonomy and consent. Most people say this is an extreme betrayal of trust.", majorityLabel: "Most say: yes — reproductive deception is a serious violation" },
  { category: "Marriage", text: "You've been texting someone late at night for months. When your spouse asks who you're texting, you say 'no one.' They believe you.", hint: "You lied directly and they accepted it.", verdict: true, explanation: "A direct lie about who you're communicating with — repeated over months — is a betrayal of trust most people consider cheating, regardless of what the texts contain.", majorityLabel: "Most say: yes — the sustained lie is the problem" },

  // --- NEW: Long-distance & Modern ---
  { category: "Long-distance", text: "You're in a long-distance relationship. You go on what feels like a date with a local friend — nice restaurant, long walk, easy conversation. You split the bill. You don't mention it.", hint: "You wouldn't call it a date. But you dressed up.", verdict: false, explanation: "A friendly dinner with someone, however date-like in feel, isn't infidelity if nothing romantic happened. Most people say the context matters more than the ambiance.", majorityLabel: "Most say: no — a nice dinner with a friend isn't cheating" },
  { category: "Long-distance", text: "Your long-distance partner hasn't visited in eight months. A neighbor has been bringing you food during a rough patch. You've started to look forward to their knock on the door more than any video call.", hint: "Proximity versus distance.", verdict: false, explanation: "Looking forward to someone's company isn't infidelity. Most people say the emotional shift is a warning sign worth addressing — but it isn't cheating yet.", majorityLabel: "Most say: no — feelings without action aren't betrayal" },
  { category: "Long-distance", text: "You buy a gift for your long-distance partner's birthday but spend the same day helping your local friend move — including her birthday dinner. You forget to call your partner until midnight.", hint: "You forgot them on their birthday.", verdict: false, explanation: "Being forgetful and prioritizing a local friend is thoughtless but not infidelity. Most people say bad partnership isn't the same as cheating.", majorityLabel: "Most say: not cheating — just not great" },
  { category: "Long-distance", text: "Your partner is in another country for a year. You sleep over at a friend's place after a party because it was late. You tell your partner you slept at home.", hint: "Nothing happened. But you lied about where you were.", verdict: true, explanation: "Lying about your whereabouts — even when nothing happened — is a breach of trust most people consider problematic, especially in a long-distance relationship built on honesty.", majorityLabel: "Most say: yes — the lie is what matters" },

  // --- NEW: Social & Public ---
  { category: "Social", text: "You introduce your partner to your friends as 'a friend' at a party because the group doesn't know you're dating yet.", hint: "It's early. You weren't ready to announce it.", verdict: false, explanation: "Early-relationship privacy around your social circle isn't infidelity. Most people say timing a public relationship reveal is a personal decision, not a betrayal.", majorityLabel: "Most say: no — timing an announcement is fine" },
  { category: "Social", text: "At a dinner party, you spend the entire night engrossed in conversation with an attractive stranger and barely speak to your partner. You don't exchange numbers.", hint: "Hours of riveted attention. Nothing more.", verdict: false, explanation: "Being captivated by someone in conversation isn't cheating. Most people say the social context, no exchange of contact, and no follow-up make this fine — if inconsiderate.", majorityLabel: "Most say: no — but check in on your partner next time" },
  { category: "Social", text: "You write a glowing toast at a friend's wedding that's clearly about someone other than your partner, and everyone at the table notices.", hint: "It's a public display of feeling.", verdict: false, explanation: "A wedding toast, however revealing about your inner life, isn't infidelity. Most people say public emotional expressions don't constitute cheating — though it might prompt a conversation.", majorityLabel: "Most say: not cheating — but an interesting conversation starter" },
  { category: "Social", text: "You spend three weekends in a row helping your ex move, set up their apartment, and host their housewarming. Your partner is not invited and barely mentioned.", hint: "Weeks of your time. One person's benefit. Kept quiet.", verdict: true, explanation: "Sustained, secret investment of time and energy in an ex — hidden from your partner — is widely seen as a form of emotional betrayal regardless of whether it's romantic.", majorityLabel: "Most say: yes — three weekends for an ex you're hiding is too much" },
  { category: "Social", text: "Your ex shows up unexpectedly at an event and you spend the evening talking to them. You don't tell your partner because you know they'd be upset.", hint: "You didn't plan it. You didn't leave. You didn't tell.", verdict: true, explanation: "Hiding an unexpected but sustained encounter with an ex out of fear of your partner's reaction is a form of deception most people consider a breach of trust.", majorityLabel: "Most say: yes — hiding it because you knew is the problem" },

  // --- NEW: Philosophical & Identity ---
  { category: "Philosophical", text: "You believe that jealousy is a social construct and therefore your partner has no legitimate claim to your romantic exclusivity. You act accordingly — without discussing this with them.", hint: "A belief held alone and acted on alone.", verdict: true, explanation: "Your philosophical beliefs don't exempt you from the commitments your partner believes you've made. Most people say unilateral reinterpretation of a relationship's terms is a betrayal.", majorityLabel: "Most say: yes — beliefs don't override your partner's expectations" },

const WEBHOOK_URL = 'https://hook.us2.make.com/u4na14v6adp3x8iyummeeygvr0uw9sfj';
const SESSION_ID = Math.random().toString(36).substring(2, 10).toUpperCase();

function sendWebhook(payload) {
  fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(function() {});
}

let pool = [];
let current = 0;
let agreeCount = 0;
let streak = 0;
let userAnswers = [];
const TOTAL = 200;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  pool = shuffle(ALL_SCENARIOS).slice(0, TOTAL);
  current = 0;
  agreeCount = 0;
  streak = 0;
  userAnswers = [];
  document.getElementById('results-screen').classList.remove('show');
  document.getElementById('main-card').style.display = '';
  renderQ();
}

function renderQ() {
  const s = pool[current];
  document.getElementById('cat-tag').textContent = s.category;
  document.getElementById('scenario-text').textContent = s.text;
  document.getElementById('scenario-hint').textContent = s.hint || '';
  document.getElementById('verdict').classList.remove('show');
  document.getElementById('next-wrap').classList.remove('show');
  document.getElementById('btn-yes').disabled = false;
  document.getElementById('btn-no').disabled = false;
  document.getElementById('btn-yes').style.opacity = '1';
  document.getElementById('btn-no').style.opacity = '1';

  const pct = Math.round((current / TOTAL) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-label').textContent = 'Question ' + (current + 1) + ' of ' + TOTAL;
  document.getElementById('q-val').textContent = (current + 1) + ' / ' + TOTAL;
  document.getElementById('agree-val').textContent = agreeCount;
  document.getElementById('streak-val').textContent = streak > 0 ? streak + '🔥' : '—';

  document.getElementById('card-inner').classList.add('card-swap');
  setTimeout(() => document.getElementById('card-inner').classList.remove('card-swap'), 400);
}

function answer(userSays) {
  const s = pool[current];
  const correct = userSays === s.verdict;
  if (correct) { agreeCount++; streak++; } else { streak = 0; }
  userAnswers.push({ scenario: s, userSaid: userSays, agreed: correct });

  sendWebhook({
    event: 'answer',
    session_id: SESSION_ID,
    timestamp: new Date().toISOString(),
    question_number: current + 1,
    total_questions: TOTAL,
    category: s.category,
    scenario: s.text,
    user_said: userSays ? 'cheating' : 'not cheating',
    majority_verdict: s.verdict ? 'cheating' : 'not cheating',
    agreed_with_majority: correct,
    agree_count_so_far: agreeCount,
    current_streak: streak
  });

  document.getElementById('btn-yes').disabled = true;
  document.getElementById('btn-no').disabled = true;
  document.getElementById('btn-yes').style.opacity = userSays === true ? '1' : '0.35';
  document.getElementById('btn-no').style.opacity = userSays === false ? '1' : '0.35';

  const dot = document.getElementById('verdict-dot');
  const res = document.getElementById('verdict-result');
  const badge = document.getElementById('verdict-badge');

  dot.className = 'verdict-dot ' + (s.verdict ? 'cheating' : 'not');
  res.className = 'verdict-result ' + (s.verdict ? 'cheating' : 'not');
  res.textContent = s.verdict ? 'Majority verdict: cheating' : 'Majority verdict: not cheating';
  badge.className = 'verdict-badge ' + (correct ? 'agree' : 'disagree');
  badge.textContent = correct ? '✓ You agreed' : '✗ You disagreed';
  document.getElementById('verdict-explanation').textContent = s.explanation;
  document.getElementById('verdict-majority').textContent = s.majorityLabel;

  document.getElementById('verdict').classList.add('show');
  document.getElementById('next-wrap').classList.add('show');

  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = current + 1 < TOTAL ? 'Continue →' : 'See my results →';

  document.getElementById('agree-val').textContent = agreeCount;
  document.getElementById('streak-val').textContent = streak > 0 ? streak + '🔥' : '—';
}

function next() {
  current++;
  if (current >= TOTAL) {
    showResults();
  } else {
    renderQ();
  }
}

function showResults() {
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-pct').textContent = '100%';

  const pct = Math.round((agreeCount / TOTAL) * 100);
  document.getElementById('final-pct').textContent = pct + '%';

  let title, personality;
  if (pct === 100) {
    title = "The Oracle";
    personality = "Perfect alignment with majority opinion on every single scenario — including the absurd ones. You either have an eerily mainstream moral compass, or you read people exceptionally well. Either way, the crowd would trust you to judge their relationship drama.";
  } else if (pct >= 85) {
    title = "The Traditionalist";
    personality = "Your moral compass is closely calibrated to consensus. You believe in clear lines, kept promises, and the sanctity of agreements. You probably give good relationship advice, and people probably actually take it.";
  } else if (pct >= 70) {
    title = "The Pragmatist";
    personality = "You're mostly conventional but willing to see nuance. You don't sweat the small stuff, but you hold firm on the big stuff. Most people would describe your takes as 'reasonable' — which you might find slightly boring.";
  } else if (pct >= 55) {
    title = "The Nuancer";
    personality = "You live in the gray areas. You see every scenario from multiple angles. You probably preface a lot of opinions with 'well, it depends.' Some call that wisdom. Some call it commitment issues.";
  } else if (pct >= 40) {
    title = "The Contrarian";
    personality = "You disagree with the majority more than you agree. Either your moral standards are unusually strict, unusually lenient, or you are constitutionally opposed to consensus. All three are respectable positions.";
  } else if (pct >= 20) {
    title = "The Libertarian";
    personality = "You believe people have the right to do almost whatever they want in their private lives, and you are slow to judge. You probably forgive a lot. You may have been forgiven for a lot. You're non-judgmental to a degree that startles people.";
  } else {
    title = "The Maverick";
    personality = "You agreed with almost no one. You are operating on a deeply personal ethical framework that exists entirely outside mainstream moral intuition. You are either very enlightened or you answered randomly. Both are valid.";
  }

  document.getElementById('results-title').textContent = title;
  document.getElementById('results-sub').textContent = 'You agreed with majority opinion on ' + agreeCount + ' of ' + TOTAL + ' scenarios (' + pct + '%)';
  document.getElementById('personality-text').textContent = personality;

  const bd = document.getElementById('breakdown');
  bd.innerHTML = userAnswers.map(function(ua) {
    return '<div class="breakdown-row"><div class="breakdown-dot ' + (ua.agreed ? 'agreed' : 'disagreed') + '"></div><div class="breakdown-q">' + ua.scenario.category + ': ' + ua.scenario.text.substring(0, 70) + '…</div><div style="font-size:12px;color:' + (ua.agreed ? 'var(--green)' : 'var(--red)') + ';">' + (ua.agreed ? 'Agreed' : 'Differed') + '</div></div>';
  }).join('');

  document.getElementById('q-val').textContent = TOTAL + ' / ' + TOTAL;
  document.getElementById('agree-val').textContent = agreeCount;
  document.getElementById('results-screen').classList.add('show');

  sendWebhook({
    event: 'game_completed',
    session_id: SESSION_ID,
    timestamp: new Date().toISOString(),
    total_questions: TOTAL,
    agreed_with_majority: agreeCount,
    disagreed_with_majority: TOTAL - agreeCount,
    agreement_percentage: Math.round((agreeCount / TOTAL) * 100),
    personality_title: title,
    answers: userAnswers.map(function(ua, i) {
      return {
        question_number: i + 1,
        category: ua.scenario.category,
        scenario: ua.scenario.text,
        user_said: ua.userSaid ? 'cheating' : 'not cheating',
        majority_verdict: ua.scenario.verdict ? 'cheating' : 'not cheating',
        agreed: ua.agreed
      };
    })
  });
}

function restart() {
  document.getElementById('results-screen').classList.remove('show');
  setTimeout(init, 50);
}

init();
</script>
